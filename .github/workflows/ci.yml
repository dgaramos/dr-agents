name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run bin/check
        run: bin/check
      - name: Validate JSON files
        run: |
          jq empty plugins/claudio-dr/.claude-plugin/plugin.json
          jq empty plugins/cody-dr/.codex-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
      - name: Check bundle sync
        run: bin/sync-plugin-core-bundles.sh --check

  authorship:
    name: Delivery authorship
    runs-on: ubuntu-latest
    # Only a pull_request event carries the head ref and author this checks.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the delivery PR was published by the App
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          .github/scripts/verify-delivery-authorship.sh \
            "$HEAD_BRANCH" "$PR_AUTHOR" "$PR_LABELS"

  syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on all .sh files
        run: |
          find .github/scripts tests bin core -name '*.sh' -print0 \
            | xargs -0 -I{} bash -n {}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: test_apply_pr_metadata
        run: bash tests/test_apply_pr_metadata.sh
      - name: test_discover_project_profile
        run: bash tests/test_discover_project_profile.sh
      - name: test_plugin_core_bundles
        run: bash tests/test_plugin_core_bundles.sh
      - name: test_helper_agents
        run: bash tests/test_helper_agents.sh
      - name: test_publish_claudio_thread_action
        run: bash tests/test_publish_claudio_thread_action.sh
      - name: test_publish_cody_thread_action
        run: bash tests/test_publish_cody_thread_action.sh
      - name: test_publish_pr_metadata
        run: bash tests/test_publish_pr_metadata.sh
      - name: test_verify_publisher_dispatch
        run: bash tests/test_verify_publisher_dispatch.sh
      - name: test_verify_delivery_authorship
        run: bash tests/test_verify_delivery_authorship.sh
      - name: test_publication_input
        run: bash tests/test_publication_input.sh
      - name: test_publisher_smoke
        run: bash tests/test_publisher_smoke.sh
      - name: test_smoke_find_issue_target
        run: bash tests/test_smoke_find_issue_target.sh
      - name: test_publication_outcomes
        run: bash tests/test_publication_outcomes.sh
      - name: test_load_review_threads
        run: bash tests/test_load_review_threads.sh
      - name: test_validate_review_manifest
        run: bash tests/test_validate_review_manifest.sh
      - name: test_install
        run: bash tests/test_install.sh
      - name: test_update
        run: bash tests/test_update.sh
      - name: test_update_download
        run: bash tests/test_update_download.sh
