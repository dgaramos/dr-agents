name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run bin/check
        run: bin/check
      - name: Validate JSON files
        run: |
          jq empty plugins/claudio-dr/.claude-plugin/plugin.json
          jq empty plugins/cody-dr/.codex-plugin/plugin.json
          jq empty .claude-plugin/marketplace.json
      - name: Check bundle sync
        run: bin/sync-plugin-core-bundles.sh --check

  authorship:
    name: Delivery authorship
    runs-on: ubuntu-latest
    # Only a pull_request event carries the head ref and author this checks.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Verify the delivery PR was published by the App
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          .github/scripts/verify-delivery-authorship.sh \
            "$HEAD_BRANCH" "$PR_AUTHOR" "$PR_LABELS"

  syntax:
    name: Shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash -n on all .sh files
        run: |
          find .github/scripts tests bin core -name '*.sh' -print0 \
            | xargs -0 -I{} bash -n {}

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # dr-agents#457: the suite is DERIVED from tests/, not enumerated. The
      # enumerated list had drifted to 23 of 41 scripts -- test_surface_metadata,
      # test_drift, test_select_publisher and test_resolve_target among the 18
      # that ran locally and in bin/check but in no required check. A hand-kept
      # list passes today and is wrong the day a test is added, which is the
      # pitfall CLAUDE.md already records. The loop names each script as it runs
      # and stops at the first failure, so a red job still says which test broke.
      - name: tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          scripts=(tests/test_*.sh)
          if [[ ${#scripts[@]} -eq 0 ]]; then
            echo "no test scripts found under tests/ -- the glob matched nothing" >&2
            exit 1
          fi
          for script in "${scripts[@]}"; do
            echo "::group::$script"
            bash "$script"
            echo "::endgroup::"
          done
          echo "ran ${#scripts[@]} test scripts"
