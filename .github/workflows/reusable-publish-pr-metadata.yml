# Central publisher definition for #260. Consumers reach this through a thin
# workflow_dispatch stub; the stub is irreducible because workflow_dispatch
# requires the workflow to exist on the consumer's default branch.
name: Apply PR metadata
on:
  workflow_call:
    inputs:
      agent:
        description: Publishing agent, claudio or cody.
        required: true
        type: string
      client_id:
        description: >-
          App client id. Passed as an input because repository variables do not
          cross the reusable-workflow boundary by inheritance.
        required: true
        type: string
      pr_number: { description: Pull request number, required: true, type: string }
      base_branch: { description: Expected base branch, required: true, type: string }
      labels_json: { description: JSON array of labels, required: false, default: '[]', type: string }
      assignees_json: { description: JSON array of assignees, required: false, default: '[]', type: string }
      reviewers_json: { description: JSON array of user logins or org/team slugs, required: false, default: '[]', type: string }
      milestone_number: { description: Optional milestone number, required: false, default: '', type: string }
      project_owner: { description: Optional Project owner, required: false, default: '', type: string }
      project_number: { description: Optional Project number, required: false, default: '', type: string }
      project_status: { description: Optional Project status, required: false, default: '', type: string }
      metadata_helper:
        description: >-
          Absolute path to an alternative metadata helper. Leave empty to use the
          catalog's own helper, which is the correct choice for every consumer:
          this workflow runs no actions/checkout, so a path relative to the
          caller's workspace cannot be read. AC-06.
        required: false
        default: ''
        type: string
      catalog_ref:
        description: >-
          The ref of this catalog that the caller resolved this workflow at. The
          stub passes the very ref it names in `uses:`, and `bin/check` asserts
          the two are identical. This is what keeps the workflow and the scripts
          on one commit: a reusable workflow cannot derive its own ref, measured
          in docs/spike-reusable-workflow-resolution.md.
        required: true
        type: string
    secrets:
      app_private_key:
        description: Private key of the publishing App.
        required: true
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Create an installation token
        id: app-token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write
          permission-pull-requests: write
      - name: Create optional organization Projects token
        id: project-token
        if: ${{ inputs.project_owner != '' && github.event.repository.owner.type == 'Organization' && inputs.project_owner == github.repository_owner }}
        continue-on-error: true
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: read
          permission-pull-requests: read
          permission-organization-projects: write
      - name: Validate the catalog ref
        id: catalog
        env:
          CATALOG_REF: ${{ inputs.catalog_ref }}
        run: |
          set -euo pipefail
          # Fail loudly here rather than with a confusing "No such file" from
          # the publisher step, which would be indistinguishable from a script
          # bug. This preserves the guard the composite action used to provide.
          if [[ -z "${CATALOG_REF}" ]]; then
            echo "catalog_ref is empty; the stub must pass the ref it calls" >&2
            exit 1
          fi
          if [[ ! "${CATALOG_REF}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "catalog_ref is malformed: '${CATALOG_REF}'" >&2
            exit 1
          fi
          # Surface the ref before anything runs, so a run's provenance is
          # readable without inferring it from an exit code.
          echo "catalog ref: ${CATALOG_REF}"
          echo "- catalog ref: \`${CATALOG_REF}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check out the catalog at the ref this workflow was called at
        # v4.4.0. The only pinned checkout in the publisher definitions.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: dgaramos/dr-agents
          ref: ${{ inputs.catalog_ref }}
          path: .dr-agents-catalog
          persist-credentials: false
      - name: Apply and verify PR metadata
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PROJECT_GH_TOKEN: ${{ steps.project-token.outputs.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          LABELS_JSON: ${{ inputs.labels_json }}
          ASSIGNEES_JSON: ${{ inputs.assignees_json }}
          REVIEWERS_JSON: ${{ inputs.reviewers_json }}
          MILESTONE_NUMBER: ${{ inputs.milestone_number }}
          PROJECT_OWNER: ${{ inputs.project_owner }}
          PROJECT_NUMBER: ${{ inputs.project_number }}
          PROJECT_STATUS: ${{ inputs.project_status }}
          # publish-pr-metadata.sh defaults this to a path relative to the
          # working directory, which only ever resolved because the vendored
          # publisher checked the catalog out first. Nothing is checked out
          # here, so the helper is addressed inside the staged catalog.
          METADATA_HELPER: ${{ inputs.metadata_helper != '' && inputs.metadata_helper || format('{0}/.dr-agents-catalog/core/issue-workflow/scripts/apply-pr-metadata.sh', github.workspace) }}
          EXPECTED_AUTHOR: ${{ inputs.agent }}-dr[bot]
          PUBLISHER_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: bash "${{ github.workspace }}/.dr-agents-catalog/.github/scripts/publish-pr-metadata.sh"
