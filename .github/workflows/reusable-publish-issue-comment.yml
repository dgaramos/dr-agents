# Central publisher definition for #269, the seventh route.
#
# The six that preceded it covered creating and updating an issue, creating a
# pull request, applying pull request metadata, replying in a review thread,
# resolving a thread, and submitting a review. Commenting on an issue had no
# route at all. That gap forced a disclosed identity break: the evidence comment
# on dr-agents#260 went out under a personal account, not as the routing
# contract's proven-unavailable fallback, but because the operation did not
# exist. Calling that a fallback obscured a missing feature.
#
# WHY A SEVENTH DEFINITION RATHER THAN A MODE ON reusable-publish-issue.yml.
# The issue left the shape open and asked for it to be measured. Two
# measurements settled it:
#
#   1. The saving is not where it looks. The cost of this change is not files in
#      the catalog; it is the release cycle -- version bump, merge, tag
#      promotion, reinstall in every consumer. A mode added to the issue
#      publisher changes the stub's dispatch surface too, so it pays that same
#      cycle in full. It saves four files and nothing else.
#   2. A mode would cost a guarantee that exists today. `title` is
#      `required: true` in the issue stub's workflow_dispatch form, and GitHub
#      enforces that at dispatch time. A comment has no title, so a shared form
#      would have to relax `title` to optional in every consumer -- weakening
#      validation on the create path, which is the most used one, to save those
#      four files.
#
# The property worth protecting -- self-contained, no checkout, no catalog_ref,
# and therefore no ref skew -- is not lost by splitting: this definition is a
# single POST and one verification, so it is born self-contained for the same
# reason the issue publisher is. tests/test_reusable_ref_resolution.sh asserts
# that for both.
#
# Consumers reach this through a thin workflow_dispatch stub; the stub is
# irreducible because workflow_dispatch requires the workflow to exist on the
# consumer's default branch.
name: Publish issue comment
on:
  workflow_call:
    inputs:
      agent:
        description: Publishing agent, claudio or cody.
        required: true
        type: string
      client_id:
        description: >-
          App client id. Passed as an input because repository variables do not
          cross the reusable-workflow boundary by inheritance.
        required: true
        type: string
      issue_number: { description: Issue or pull request number to comment on, required: true, type: string }
      body: { description: Comment body in Markdown, required: true, type: string }
      stub_version:
        description: >-
          The catalog version of the stub that dispatched this run, passed as a
          literal equal to the stub's own `# <agent>-dr: v` marker. Compared
          against the minimum this definition requires, so a stub that predates
          a required input is reported instead of silently passing it empty
          (dr-agents#268). Not required, and empty-defaulted: a stub old enough
          to predate the guard cannot pass it, and failing those would break
          working consumers.
        required: false
        default: ''
        type: string
    secrets:
      app_private_key:
        description: Private key of the publishing App.
        required: true
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Announce the release and check the caller's stub version
        # First step in every publisher, so a run's provenance is readable even
        # when a later step fails. The catalog ref names what the caller asked
        # for; this names what actually executed, which is what distinguishes
        # the definition before a tag promotion from the one after it. Kept in
        # agreement across all seven definitions by bin/check (dr-agents#260).
        env:
          STUB_VERSION: ${{ inputs.stub_version }}
        run: |
          set -euo pipefail
          echo "publisher definition release: 3"
          echo "- publisher definition release: \`3\`" >> "$GITHUB_STEP_SUMMARY"

          # dr-agents#268. A stub is a file copied into the consumer, so a
          # definition that gains an input the stub must pass is simply not
          # passed it by an older stub: the input arrives empty and nothing
          # says so. This compares the caller's stub against the minimum this
          # definition needs.
          #
          # The comparand is a literal here rather than the catalog version
          # staged at catalog_ref, which is what dr-agents#268 originally
          # proposed. Two measurements changed that. Comparing against the
          # *current* catalog version would fire on every routine version bump,
          # in consumers that are perfectly correct, and a guard that alarms
          # when all is well is ignored within two releases -- reintroducing the
          # silence by another route. And the two self-contained definitions,
          # reusable-publish-issue.yml and reusable-publish-issue-comment.yml,
          # perform no checkout and take no catalog_ref, a property
          # tests/test_reusable_ref_resolution.sh asserts; a literal needs no
          # staged catalog, so those need no exception for it.
          #
          # Bump it ONLY when a definition gains an input a stub must pass. All
          # seven must agree; bin/check enforces that, because a partial bump
          # would make the guard lie about what it requires.
          minimum_stub_version="0.1.31"
          echo "minimum stub version: ${minimum_stub_version}"
          echo "- minimum stub version: \`${minimum_stub_version}\`" >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${STUB_VERSION}" ]]; then
            # Forward-only by construction: a stub old enough to predate this
            # guard cannot pass the input that would report it. Deliberately not
            # fatal -- every stub installed before this shipped is in this
            # state and almost all of them are fine, so failing here would break
            # working consumers over a usually benign condition. Loud in both
            # channels instead, because a warning nobody reads is the same
            # silence under another name.
            echo "stub-version-unknown: this stub predates the version guard and does not report its version; reinstall with bin/install" >&2
            {
              echo "- stub version: \`stub-version-unknown\`"
              echo "- This stub predates the version guard, so it cannot report"
              echo "  its version and cannot be checked against the minimum above."
              echo "  Reinstall it with \`bin/install\` to make this checkable."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! "${STUB_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Rejected rather than compared and silently passing.
            echo "stub-version-malformed: '${STUB_VERSION}' is not a three-part numeric version" >&2
            {
              echo "- stub version: \`stub-version-malformed\` (\`${STUB_VERSION}\`)"
              echo "- The stub reported a version this guard cannot compare."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            # Field-wise numeric comparison. A lexical compare puts 0.1.9 ABOVE
            # 0.1.31 and would let an outdated stub through -- silently, which
            # is the exact failure this guard exists to end.
            oldest="$(printf '%s\n%s\n' "${minimum_stub_version}" "${STUB_VERSION}" \
              | sort -t. -k1,1n -k2,2n -k3,3n | head -1)"
            if [[ "${oldest}" == "${STUB_VERSION}" && "${STUB_VERSION}" != "${minimum_stub_version}" ]]; then
              echo "stub-outdated: caller's stub is v${STUB_VERSION}, this definition requires v${minimum_stub_version} or later; reinstall with bin/install" >&2
              {
                echo "- stub version: \`stub-outdated\` (\`${STUB_VERSION}\`)"
                echo "- This stub predates an input this publisher requires, so that"
                echo "  input would arrive empty. Nothing has been published."
                echo "  Reinstall the stub with \`bin/install\` and dispatch again."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "stub version: ${STUB_VERSION}"
            echo "- stub version: \`${STUB_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create an installation token
        id: app-token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # The same permission that lets the App create the comment lets it
          # delete one. That is what makes the smoke test's disposable target
          # work without accumulating litter -- see the note in
          # .github/scripts/smoke-publishers-reap.sh.
          permission-issues: write

      - name: Create and verify the comment
        id: comment
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BODY: ${{ inputs.body }}
          EXPECTED_AUTHOR: ${{ inputs.agent }}-dr[bot]
        run: |
          set -euo pipefail
          # The typed outcome vocabulary is emitted inline rather than sourced
          # from .github/scripts/publication-outcome.sh. That is deliberate and
          # it is not an oversight to unify later: sourcing that script requires
          # a checkout, a checkout requires a catalog_ref, and a catalog_ref
          # reintroduces exactly the ref-skew class that
          # tests/test_reusable_ref_resolution.sh asserts this definition is
          # free of. reusable-publish-issue.yml carries the same duplication for
          # the same reason.
          not_published() {
            {
              echo "### ${{ inputs.agent }}-dr issue comment publisher"
              echo
              echo "- outcome: \`not-published\`"
              echo "- reason: $1"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "not-published: $1" >&2
            exit 1
          }
          # Every rejection below happens before any GitHub call, which is what
          # makes `not-published` mean "nothing exists, retrying is safe".
          [[ -n "$ISSUE_NUMBER" ]] || not_published "issue_number is required"
          [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || not_published "issue_number must be a positive integer, got: $ISSUE_NUMBER"
          [[ -n "$BODY" ]] || not_published "body is required"

          # The author of the HOST issue is deliberately not checked. The issue
          # publisher verifies it before a PATCH because editing someone else's
          # issue would be wrong; commenting on someone else's issue is the
          # ordinary case, and requiring App authorship of the host would invent
          # a restriction the publication routing contract does not ask for.
          # The authorship that matters here is the comment's own, verified
          # below.
          jq -n --arg body "$BODY" '{body: $body}' > comment.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            --input comment.json > created-comment.json

          # The mutation has happened. Emit the resource identifier before any
          # verification runs, so a red job is never read as "nothing was
          # published" -- the dr-agents#258 lesson, where a job exited 1 over a
          # comment that was already public.
          comment_id="$(jq -r '.id' created-comment.json)"
          comment_url="$(jq -r '.html_url' created-comment.json)"
          {
            echo "### ${{ inputs.agent }}-dr issue comment publisher"
            echo
            echo "- resource: [comment on #${ISSUE_NUMBER}](${comment_url})"
          } >> "$GITHUB_STEP_SUMMARY"
          # Deliberately not exported as a job output. Nothing consumes one: the
          # smoke reaper finds this comment by author and age rather than by a
          # threaded identifier, which is what makes it able to clean up after a
          # run that died before it could report anything.

          actual_author="$(jq -r '.user.login' created-comment.json)"
          if [[ "$actual_author" != "$EXPECTED_AUTHOR" ]]; then
            {
              echo "- outcome: \`published-unverified\`"
              echo "- expected author \`${EXPECTED_AUTHOR}\`, got \`${actual_author}\`"
              echo
              echo "The comment **was published**. Do not republish it, and do not"
              echo "publish it again under another identity. Inspect the resource above"
              echo "and correct the attribution in place."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "published-unverified: comment ${comment_id} exists with author ${actual_author}; do not republish" >&2
            exit 1
          fi
          echo "- outcome: \`published-ok\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Created and verified comment ${comment_id}: ${comment_url}"
