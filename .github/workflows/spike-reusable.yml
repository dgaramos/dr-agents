# Throwaway spike for dr-agents#260 T01. Removed before the PR1 handoff.
name: T01 spike reusable

on:
  workflow_call:
    inputs:
      call_form:
        description: Which uses form the caller used to reach this workflow.
        required: true
        type: string

permissions: {}

jobs:
  probe-remote-action:
    name: Composite resolved by full remote path
    runs-on: ubuntu-latest
    steps:
      - uses: dgaramos/dr-agents/.github/actions/spike-probe@260-feat/reusable-workflow-publishers
        with:
          call_form: ${{ inputs.call_form }} + remote action path

  probe-local-action:
    name: Composite resolved by local ./ path
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: ./.github/actions/spike-probe
        with:
          call_form: ${{ inputs.call_form }} + local ./ action path
