# Central publisher definition for #260. Consumers reach this through a thin
# workflow_dispatch stub; the stub is irreducible because workflow_dispatch
# requires the workflow to exist on the consumer's default branch.
name: Publish issue
on:
  workflow_call:
    inputs:
      agent:
        description: Publishing agent, claudio or cody.
        required: true
        type: string
      client_id:
        description: >-
          App client id. Passed as an input because repository variables do not
          cross the reusable-workflow boundary by inheritance.
        required: true
        type: string
      title: { description: Issue title, required: true, type: string }
      issue_number: { description: Existing issue to update (omit to create), required: false, default: '', type: string }
      body: { description: Issue body in Markdown, required: true, type: string }
      labels: { description: Comma-separated labels, required: false, default: '', type: string }
      assignees: { description: Comma-separated assignees, required: false, default: '', type: string }
      milestone_number: { description: Optional numeric milestone number, required: false, default: '', type: string }
      stub_version:
        description: >-
          The catalog version of the stub that dispatched this run, passed as a
          literal equal to the stub's own `# <agent>-dr: v` marker. Compared
          against the minimum this definition requires, so a stub that predates
          a required input is reported instead of silently passing it empty
          (dr-agents#268). Not required, and empty-defaulted: a stub old enough
          to predate the guard cannot pass it, and failing those would break
          working consumers.
        required: false
        default: ''
        type: string
    secrets:
      app_private_key:
        description: Private key of the publishing App.
        required: true
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Announce the release and check the caller's stub version
        # First step in every publisher, so a run's provenance is readable even
        # when a later step fails. The catalog ref names what the caller asked
        # for; this names what actually executed, which is what distinguishes
        # the definition before a tag promotion from the one after it. Kept in
        # agreement across all six definitions by bin/check (dr-agents#260).
        env:
          STUB_VERSION: ${{ inputs.stub_version }}
        run: |
          set -euo pipefail
          echo "publisher definition release: 3"
          echo "- publisher definition release: \`3\`" >> "$GITHUB_STEP_SUMMARY"

          # dr-agents#268. A stub is a file copied into the consumer, so a
          # definition that gains an input the stub must pass is simply not
          # passed it by an older stub: the input arrives empty and nothing
          # says so. This compares the caller's stub against the minimum this
          # definition needs.
          #
          # The comparand is a literal here rather than the catalog version
          # staged at catalog_ref, which is what dr-agents#268 originally
          # proposed. Two measurements changed that. Comparing against the
          # *current* catalog version would fire on every routine version bump,
          # in consumers that are perfectly correct, and a guard that alarms
          # when all is well is ignored within two releases -- reintroducing the
          # silence by another route. And reusable-publish-issue.yml performs no
          # checkout and takes no catalog_ref, a property
          # tests/test_reusable_ref_resolution.sh asserts; a literal needs no
          # staged catalog, so this needs no exception for it.
          #
          # Bump it ONLY when a definition gains an input a stub must pass. All
          # six must agree; bin/check enforces that, because a partial bump
          # would make the guard lie about what it requires.
          minimum_stub_version="0.1.31"
          echo "minimum stub version: ${minimum_stub_version}"
          echo "- minimum stub version: \`${minimum_stub_version}\`" >> "$GITHUB_STEP_SUMMARY"

          if [[ -z "${STUB_VERSION}" ]]; then
            # Forward-only by construction: a stub old enough to predate this
            # guard cannot pass the input that would report it. Deliberately not
            # fatal -- every stub installed before this shipped is in this
            # state and almost all of them are fine, so failing here would break
            # working consumers over a usually benign condition. Loud in both
            # channels instead, because a warning nobody reads is the same
            # silence under another name.
            echo "stub-version-unknown: this stub predates the version guard and does not report its version; reinstall with bin/install" >&2
            {
              echo "- stub version: \`stub-version-unknown\`"
              echo "- This stub predates the version guard, so it cannot report"
              echo "  its version and cannot be checked against the minimum above."
              echo "  Reinstall it with \`bin/install\` to make this checkable."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [[ ! "${STUB_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            # Rejected rather than compared and silently passing.
            echo "stub-version-malformed: '${STUB_VERSION}' is not a three-part numeric version" >&2
            {
              echo "- stub version: \`stub-version-malformed\` (\`${STUB_VERSION}\`)"
              echo "- The stub reported a version this guard cannot compare."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            # Field-wise numeric comparison. A lexical compare puts 0.1.9 ABOVE
            # 0.1.31 and would let an outdated stub through -- silently, which
            # is the exact failure this guard exists to end.
            oldest="$(printf '%s\n%s\n' "${minimum_stub_version}" "${STUB_VERSION}" \
              | sort -t. -k1,1n -k2,2n -k3,3n | head -1)"
            if [[ "${oldest}" == "${STUB_VERSION}" && "${STUB_VERSION}" != "${minimum_stub_version}" ]]; then
              echo "stub-outdated: caller's stub is v${STUB_VERSION}, this definition requires v${minimum_stub_version} or later; reinstall with bin/install" >&2
              {
                echo "- stub version: \`stub-outdated\` (\`${STUB_VERSION}\`)"
                echo "- This stub predates an input this publisher requires, so that"
                echo "  input would arrive empty. Nothing has been published."
                echo "  Reinstall the stub with \`bin/install\` and dispatch again."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "stub version: ${STUB_VERSION}"
            echo "- stub version: \`${STUB_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create an installation token
        id: app-token
        # v3.2.0
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ inputs.client_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-issues: write

      - name: Create and verify issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: ${{ inputs.title }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          BODY: ${{ inputs.body }}
          LABELS: ${{ inputs.labels }}
          ASSIGNEES: ${{ inputs.assignees }}
          MILESTONE_NUMBER: ${{ inputs.milestone_number }}
          EXPECTED_AUTHOR: ${{ inputs.agent }}-dr[bot]
        run: |
          set -euo pipefail
          # Typed publication outcome. `not-published` is only ever emitted
          # before any GitHub mutation has been attempted.
          not_published() {
            {
              echo "### ${{ inputs.agent }}-dr issue publisher"
              echo
              echo "- outcome: \`not-published\`"
              echo "- reason: $1"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "not-published: $1" >&2
            exit 1
          }
          [[ -n "$TITLE" || -n "$ISSUE_NUMBER" ]] || not_published "title or issue_number is required"
          [[ -n "$BODY" ]] || not_published "body is required"
          [[ -z "$MILESTONE_NUMBER" || "$MILESTONE_NUMBER" =~ ^[1-9][0-9]*$ ]] || not_published "milestone_number must be a positive integer"
          jq -n \
            --arg title "$TITLE" \
            --arg body "$BODY" \
            --arg labels "$LABELS" \
            --arg assignees "$ASSIGNEES" \
            --arg milestone "$MILESTONE_NUMBER" \
            '{title: $title, body: $body}
             + (if $labels == "" then {} else {labels: ($labels | split(",") | map(select(length > 0)))} end)
             + (if $assignees == "" then {} else {assignees: ($assignees | split(",") | map(select(length > 0)))} end)
             + (if $milestone == "" then {} else {milestone: ($milestone | tonumber)} end)' > issue.json
          if [[ -n "$ISSUE_NUMBER" ]]; then
            [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]] || not_published "issue_number must be a positive integer, got: $ISSUE_NUMBER"
            existing_author="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .user.login)"
            [[ "$existing_author" == "$EXPECTED_AUTHOR" ]] || not_published "unexpected existing issue author: expected ${EXPECTED_AUTHOR}, got ${existing_author}"
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --input issue.json > created-issue.json
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues" --input issue.json > created-issue.json
          fi
          # The mutation has happened. Emit the resource identifier before any
          # verification runs, so a red job is never read as "nothing was published".
          issue_number="$(jq -r '.number' created-issue.json)"
          issue_url="$(jq -r '.html_url' created-issue.json)"
          {
            echo "### ${{ inputs.agent }}-dr issue publisher"
            echo
            echo "- resource: [#${issue_number}](${issue_url})"
          } >> "$GITHUB_STEP_SUMMARY"
          actual_author="$(jq -r '.user.login' created-issue.json)"
          if [[ "$actual_author" != "$EXPECTED_AUTHOR" ]]; then
            {
              echo "- outcome: \`published-unverified\`"
              echo "- expected author \`${EXPECTED_AUTHOR}\`, got \`${actual_author}\`"
              echo
              echo "Issue #${issue_number} **was published**. Do not republish it, and do not"
              echo "publish it again under another identity. Inspect the resource above and"
              echo "correct the attribution in place."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "published-unverified: issue #${issue_number} exists with author ${actual_author}; do not republish" >&2
            exit 1
          fi
          echo "- outcome: \`published-ok\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Created and verified issue #${issue_number}: ${issue_url}"
